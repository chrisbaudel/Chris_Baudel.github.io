<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Cours de Maths</title>
    <!-- Outil pour afficher les formules mathématiques (KaTeX) -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <script defer src="https://jsdelivr.net"></script>
    <script defer src="https://jsdelivr.net" onload="renderMathInElement(document.body);"></script>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 40px; background-color: #f9f9f9; color: #333; }
        max-width { max-width: 800px; margin: auto; }
        h1 { color: #2c3e50; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="max-width">
        <h1>Bienvenue sur mon site de Mathématiques 📐</h1>
        <div class="box">
            <p>Ce site hébergera bientôt mes cours de lycée et des applications d'entraînement pour le Bac.</p>
            <p><strong>Exemple de formule mathématique :</strong></p>
            <!-- Les formules entre $$ s'afficheront magnifiquement -->
            <p>La célèbre fonction exponentielle : $$f(x) = e^x$$</p>
            <p>Ou une équation du second degré : $$ax^2 + bx + c = 0$$</p>
        </div>
    </div>
</body>
</html>
